<nav class="appnav" aria-label="Dashboards">
  <div class="appnav-in">
    <a href="/usage">Usage</a><a href="/errors">Errors</a>
    <span class="appnav-filter" id="navFilter" hidden></span>
    <span class="appnav-status" id="navStatus" aria-live="polite"></span>
    <button type="button" id="navRefresh">Refresh</button>
  </div>
</nav>
<style>
.appnav { background: var(--surface-1); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.appnav-in { max-width: 1240px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.appnav a { color: var(--text-secondary); text-decoration: none; padding: 5px 10px; border-radius: 8px; font-weight: 500; }
.appnav a:hover { background: var(--surface-2); color: var(--text-primary); }
.appnav a[aria-current=page] { background: var(--text-primary); color: var(--surface-1); }
.appnav-filter { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 2px 4px 2px 10px; border-radius: 999px;
  background: var(--series-1-soft); color: var(--text-primary); font-size: 13px; max-width: 100%; }
.appnav-filter[hidden] { display: none; }
.appnav-filter b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.appnav-filter button { border: 0; background: none; padding: 2px 6px; border-radius: 999px; font-size: 12px; color: var(--text-secondary); }
.appnav-filter button:hover { background: var(--surface-2); color: var(--text-primary); }
.appnav-status { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.appnav button { font-size: 13px; padding: 4px 10px; }
#navRefresh.failed { border-color: var(--critical-text, #b42318); color: var(--critical-text, #b42318); }
/* Phones: one compact row; ingest status moves into the Refresh button's tooltip. */
@media (max-width: 520px) {
  .appnav-in { flex-wrap: nowrap; padding: 6px 12px; gap: 4px; }
  .appnav a { padding: 4px 8px; }
  .appnav-filter { margin-left: 2px; min-width: 0; padding-left: 8px; }
  .appnav-filter > span:first-child { display: none; }
  .appnav-filter .lbl { display: none; }
  /* Status stays readable to screen readers; failures stay visible on the button. */
  .appnav-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #navRefresh { margin-left: auto; flex: none; }
}
</style>
<script>
(() => {
  // Project and range travel between pages; page-only keys (ex, cat, session) stay behind.
  const shared = () => {
    const h = new URLSearchParams(location.hash.slice(1)), out = new URLSearchParams();
    for (const k of ["project", "range"]) if (h.has(k) && h.get(k) !== "") out.set(k, h.get(k));
    return String(out) ? "#" + out : "";
  };
  document.querySelectorAll(".appnav a").forEach(a => {
    const path = a.getAttribute("href");
    if (path === location.pathname) a.setAttribute("aria-current", "page");
    const sync = () => { a.href = path + shared(); };
    a.addEventListener("pointerdown", sync); a.addEventListener("focus", sync); a.addEventListener("click", sync);
  });
  // The project filter follows you across pages, so show it here with a way out.
  const chip = document.getElementById("navFilter");
  const sync = () => {
    const p = new URLSearchParams(location.hash.slice(1)).get("project");
    chip.hidden = !p;
    chip.innerHTML = p ? `<span>Project</span><b></b><button type="button" aria-label="Clear project filter" title="Show all projects">✕<span class="lbl"> Clear</span></button>` : "";
    if (!p) return;
    chip.querySelector("b").textContent = p;
    chip.querySelector("button").onclick = () => {
      const h = new URLSearchParams(location.hash.slice(1));
      h.delete("project"); h.delete("session");
      location.hash = String(h);
      document.getElementById("fProject")?.focus();
    };
  };
  window.appnav = { sync };
  // Pages offset scroll targets by the sticky nav's height, which grows when it wraps on phones.
  const nav = document.querySelector(".appnav");
  new ResizeObserver(() => document.documentElement.style.setProperty("--appnav-h", nav.offsetHeight + "px")).observe(nav);
  window.addEventListener("hashchange", sync);
  sync();
  const el = document.getElementById("navStatus"), btn = document.getElementById("navRefresh");
  let wasIngesting = null;
  const show = s => {
    const st = s.last_stats ? ` · ${s.last_stats.inserted.toLocaleString()} new lines` : "";
    el.textContent = s.error ? `Ingest failed: ${s.error}` : s.ingesting ? "Ingesting transcripts…"
      : s.last_ingest ? `Last ingest ${new Date(s.last_ingest).toLocaleTimeString()}${st}` : "";
    btn.title = el.textContent; btn.classList.toggle("failed", !!s.error);
    // The first ingest after start runs while the page is open; reload once it lands.
    if (wasIngesting && !s.ingesting && s.last_stats?.inserted) return location.reload();
    if (s.ingesting) wasIngesting = true;
    if (s.ingesting) setTimeout(poll, 3000);
  };
  const poll = () => fetch("/api/status").then(r => r.json()).then(show).catch(() => { el.textContent = btn.title = "App not reachable"; btn.classList.add("failed"); });
  btn.addEventListener("click", () => {
    btn.disabled = true; el.textContent = "Ingesting…";
    fetch("/api/refresh", { method: "POST" }).then(r => r.json()).then(() => location.reload())
      .catch(() => {
        el.textContent = "Refresh failed. Select Retry to try again.";
        btn.disabled = false; btn.textContent = "Retry"; btn.title = el.textContent; btn.classList.add("failed");
      });
  });
  poll();
})();
</script>
