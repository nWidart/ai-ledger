<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Tool Errors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #66655f;
  --series-1: #2a78d6; --series-1-soft: rgba(42,120,214,.12); --series-2: #eb6834;
  --grid: #e8e6e1; --good: #0ca30c; --good-text: #006300; --critical: #d03b3b;
  --accent: #2a78d6; --link: #1f62b5; --critical-text: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9d9c94;
    --series-1: #3987e5; --series-1-soft: rgba(57,135,229,.18); --series-2: #d95926;
    --grid: #2b2b28; --good-text: #4cc94c; --critical: #e66767; --accent: #3987e5;
    --link: #5c9df0; --critical-text: #f07a7a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #33332f;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9d9c94;
  --series-1: #3987e5; --series-1-soft: rgba(57,135,229,.18); --series-2: #d95926;
  --grid: #2b2b28; --good-text: #4cc94c; --critical: #e66767; --accent: #3987e5;
  --link: #5c9df0; --critical-text: #f07a7a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary);
  font: 14px/1.45 "IBM Plex Sans", ui-sans-serif, -apple-system, system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--text-muted); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
select, input[type=date], input[type=search], button {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { background: var(--surface-2); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; }
.seg button[aria-pressed=true] { background: var(--text-primary); color: var(--surface-1); }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.kpi .label { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.kpi .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .note { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.delta-down { color: var(--good-text); } .delta-up { color: var(--critical-text); }
.chart-card h2, .card h2 { font-size: 15px; margin: 0 0 2px; }
.chart-card .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
#chart { position: relative; border-radius: 6px; }
#chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
#chart svg { display: block; width: 100%; height: 260px; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  white-space: nowrap; display: none; z-index: 2; }
.tip b { font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.grid2 > *, .kpis > * { min-width: 0; }
@media (max-width: 520px) {
  .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpis .card { padding: 10px 12px; }
  .kpi .value { font-size: 20px; }
}
.tscroll { overflow-x: auto; }
@media (max-width: 520px) { .c-share, .c-trend { display: none; } }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--series-1-soft); }
.tbtn { background: none; border: 0; border-radius: 4px; padding: 0; text-align: left; color: inherit; }
.tbtn:hover { background: none; }
.tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; min-width: 60px; }
.bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
.chip { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
.chip.fixed { border-color: var(--good); color: var(--good-text); }
.spark { width: 84px; height: 22px; display: block; }
.detail h2 { font-size: 18px; margin-bottom: 4px; }
.detail .why { color: var(--text-secondary); margin: 0 0 12px; }
.fixbox { background: var(--surface-2); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.fixbox .t { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
pre.snip { margin: 8px 0 0; padding: 10px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.ba div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.ba .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ba .l { font-size: 12px; color: var(--text-muted); }
.ba .v.muted { font-size: 15px; font-weight: 500; padding: 3px 0; }
.ex { border-top: 1px solid var(--border); padding: 10px 0; }
.ex .meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.ex code, .ex .err { display: block; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word;
  overflow-wrap: anywhere; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.ex .err { color: var(--critical-text); }
/* Long bodies start clamped; "Show full" opens one example. */
.ex:not(.open) code, .ex:not(.open) .err, .ex:not(.open) blockquote { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.ex:not(.open) .err { -webkit-line-clamp: 4; }
.ex .full { display: block; font-size: 11px; padding: 1px 7px; border-radius: 6px; margin-top: 6px; }
.ex .full[hidden] { display: none; }
.ex .full[aria-busy=true] { cursor: progress; color: var(--text-muted); }
.ex .full.failed { border-color: var(--critical); color: var(--critical-text); }
.ex .cutnote { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.ex:not(.open) .cutnote { display: none; }
#exList .ex { cursor: pointer; }
.ex.focus { background: var(--series-1-soft); box-shadow: inset 3px 0 0 var(--series-1); padding-left: 10px; padding-right: 8px; border-radius: 6px; }
.ex .meta .link { margin-left: auto; display: inline-flex; gap: 6px; }
.ex .meta a { color: var(--link); text-decoration: none; }
.ex .meta a:hover { text-decoration: underline; }
.ex .meta button { font-size: 11px; padding: 1px 7px; border-radius: 6px; }
.ex blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 3px solid var(--series-1); color: var(--text-secondary); font-size: 13px; }
.muted { color: var(--text-muted); }
.pick { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 10px 4px; }
.pick > span { display: block; }
.pick:focus-visible, .ex:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.outnote { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
#load { margin-bottom: 16px; }
#detailTitle, .ex { scroll-margin-top: calc(var(--appnav-h, 56px) + 12px); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font-size: 13px; }
.linkbtn:hover { background: none; text-decoration: underline; }
/* Wide screens: the type header and the example search stay in view while the examples scroll. */
@media (min-width: 901px) {
  #detail .dhead, #detail .exbar { position: sticky; z-index: 1; background: var(--surface-1); margin: 0 -16px; padding: 10px 16px; }
  #detail .dhead { top: var(--appnav-h, 56px); flex-wrap: nowrap; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  #detail .dhead h2 { margin: 0; min-width: 0; }
  #detail .exbar { top: calc(var(--appnav-h, 56px) + var(--dhead-h, 0px)); border-bottom: 1px solid var(--border); padding-bottom: 0; }
  #detail .ex { scroll-margin-top: calc(var(--appnav-h, 56px) + var(--dhead-h, 0px) + var(--exbar-h, 0px) + 12px); }
}
.sheet #back { display: none; }
#detailTitle:focus { outline: none; }
/* Narrow screens: an open type shows in a sheet over the page; #detail moves into it and back. */
dialog.sheet { inset: 0 0 0 auto; margin: 0; width: min(640px, 100%); max-width: 100%; height: 100dvh; max-height: 100dvh;
  padding: 0; border: 0; border-left: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  overflow: auto; overscroll-behavior: contain; box-shadow: -8px 0 32px rgba(0,0,0,.16); }
dialog.sheet::backdrop { background: rgba(0,0,0,.3); }
.sheet > .detail { border: 0; border-radius: 0; min-height: 100%; padding-top: 0; overflow-wrap: anywhere; }
.sheet .dhead { position: sticky; top: 0; z-index: 1; flex-wrap: nowrap; margin: 0 -16px 12px; padding: 12px 16px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet .dhead h2 { margin: 0; min-width: 0; }
.sheet .exbar { position: sticky; top: var(--dhead-h, 0px); z-index: 1; margin: 0 -16px; padding: 0 16px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet .ex { scroll-margin-top: calc(var(--dhead-h, 0px) + var(--exbar-h, 0px) + 12px); }
.empty { color: var(--text-muted); padding: 24px 0; text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<!--NAV-->
<div class="wrap">
  <header>
    <h1 tabindex="-1">Claude tool errors</h1>
    <span class="sub" id="gen"></span>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <select id="fProject" aria-label="Project"></select>
    <div class="seg" id="fRange" role="group" aria-label="Time range">
      <button data-v="7">7d</button><button data-v="14">14d</button><button data-v="30">30d</button><button data-v="90">90d</button><button data-v="0">All</button>
    </div>
    <div class="seg" id="fGran" role="group" aria-label="Granularity">
      <button data-v="day">Day</button><button data-v="week">Week</button>
    </div>
    <label class="chk"><input type="checkbox" id="fSub" checked> Include subagents</label>
    <label class="chk"><input type="checkbox" id="fNoise"> Hide noise (harness, user rejections)</label>
  </div>

  <div class="card" id="load" role="status">Loading errors…</div>
  <div class="sr" id="pageLive" aria-live="polite"></div>
  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <section class="card chart-card">
    <h2 id="chartTitle">Error rate</h2>
    <div class="hint" id="chartHint">Errors per 100 tool calls. Dashed lines mark fixes you applied (fixes apply to all projects).</div>
    <div id="chart" tabindex="0" role="img" aria-label="Error rate chart. Use the left and right arrow keys to read each point."></div>
    <div class="sr" id="chartLive" aria-live="polite"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>Error types</h2>
      <div class="hint muted" style="font-size:12px;margin-bottom:8px">Trend compares the second half of the range with the first half. Click a row for fixes and examples.</div>
      <div class="tscroll"><table>
        <thead><tr><th>Type</th><th class="num">Errors</th><th class="c-share">Share</th><th class="c-trend">Rate trend</th><th class="num">Change</th><th>Status</th></tr></thead>
        <tbody id="catBody"></tbody>
      </table></div>
    </section>
    <section class="card detail" id="detail"></section>
    <div class="sr" id="detailLive" aria-live="polite"></div>
  </div>
</div>
<dialog class="sheet" id="sheet" aria-labelledby="detailTitle"></dialog>
<div class="tip" id="tip" role="tooltip"></div>

<script type="module">
let retried = false;
async function load() {
  for (;;) {
    try { const r = await fetch("/api/errors"); if (!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }
    catch (err) {
      const el = document.getElementById("load");
      el.setAttribute("role", "alert");
      el.innerHTML = `<b>Couldn't load errors.</b> <span class="muted"></span> <button type="button">Retry</button>`;
      el.querySelector("span").textContent = `${err.message}. Check that the app is running.`;
      el.querySelector("button").focus();
      await new Promise(res => el.querySelector("button").onclick = res);
      retried = true;
      el.setAttribute("role", "status"); el.textContent = "Loading errors…";
    }
  }
}
const DATA = await load();
document.getElementById("load").remove();
const CATS = Object.fromEntries(DATA.categories.map(c => [c.id, c]));
const NOISE = new Set(["infra", "user_denied"]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let fixes = store.get("claude-errors-fixes", {});
const state = Object.assign({ project: "", range: 30, gran: "day", sub: true, noise: false, cat: null, q: "" },
  store.get("claude-errors-view", {}));
state.q = ""; state.focus = null;
const BY_ID = Object.fromEntries(DATA.errors.filter(e => e.id).map(e => [e.id, e]));
const RANGES = [7, 14, 30, 90, 0];
// The URL hash is the view: project, range, sub=0 (no subagents), noise=0 (noise hidden), gran=week, cat (open type), ex (one linked example).
const baseUrl = () => location.href.split("#")[0];
function viewHash(focus = state.focus) {
  const p = new URLSearchParams();
  if (state.project) p.set("project", state.project);
  p.set("range", state.range);
  if (!state.sub) p.set("sub", 0);
  if (state.noise) p.set("noise", 0);
  if (state.gran === "week") p.set("gran", "week");
  if (focus) p.set("ex", focus); else if (state.cat) p.set("cat", state.cat);
  return "#" + p;
}
const exUrl = e => baseUrl() + viewHash(e.id);
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  // Any view key makes the hash the whole view: omitted keys take their defaults, and the saved view only fills an empty hash.
  // A bare #ex= link means all time.
  if (!["project", "range", "sub", "noise", "gran", "cat", "ex"].some(k => h.has(k))) return false;
  const r = +(h.get("range") ?? NaN), ex = BY_ID[h.get("ex")];
  Object.assign(state, { project: h.get("project") || "", sub: h.get("sub") !== "0", noise: h.get("noise") === "0",
    gran: h.get("gran") === "week" ? "week" : "day", range: RANGES.includes(r) ? r : h.has("ex") && !h.has("range") ? 0 : 30,
    cat: ex ? ex.c : CATS[h.get("cat")] ? h.get("cat") : null, focus: ex ? ex.id : null, q: "" });
  return !!ex;
}
let lastHash = "";
function writeHash(push) {
  const h = lastHash = viewHash();
  if (location.hash !== h) history[push ? "pushState" : "replaceState"](null, "", baseUrl() + h);
  window.appnav?.sync();
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n, d = 0) => n.toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const DAY = 864e5;
const toDate = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
// Ranges end today on the server, as on Usage.
const lastDay = DATA.today || iso(new Date());
const firstDay = DATA.calls.reduce((m, c) => (!m || c[0] < m) ? c[0] : m, "") || lastDay;

function bucketOf(day) {
  if (state.gran === "day") return day;
  const d = toDate(day); const wd = (d.getUTCDay() + 6) % 7;
  return iso(new Date(d - wd * DAY));
}

// ---------- filtering ----------
function rangeStart() {
  if (!state.range) return firstDay;
  return iso(new Date(toDate(lastDay) - (state.range - 1) * DAY));
}
function filtered() {
  const start = rangeStart();
  const errs = DATA.errors.filter(e => e.d >= start && (!state.project || e.p === state.project)
    && (state.sub || !e.sub) && (!state.noise || !NOISE.has(e.c)));
  const calls = DATA.calls.filter(c => c[0] >= start && (!state.project || c[1] === state.project));
  return { start, errs, calls };
}
// Tool calls in a [day, project, calls, subagent calls] row, matching the subagent toggle.
const nCalls = c => state.sub ? c[2] : c[2] - c[3];
const sumCalls = arr => arr.reduce((s, c) => s + nCalls(c), 0);
function buckets(start) {
  const out = []; const seen = new Set();
  for (let d = toDate(start); d <= toDate(lastDay); d = new Date(+d + DAY)) {
    const b = bucketOf(iso(d)); if (!seen.has(b)) { seen.add(b); out.push(b); }
  }
  return out;
}
function series(errs, calls, keys, cat) {
  const e = Object.fromEntries(keys.map(k => [k, 0])), c = Object.fromEntries(keys.map(k => [k, 0]));
  for (const x of errs) if (!cat || x.c === cat) { const b = bucketOf(x.d); if (b in e) e[b]++; }
  for (const x of calls) { const b = bucketOf(x[0]); if (b in c) c[b] += nCalls(x); }
  return keys.map(k => ({ k, e: e[k], c: c[k], r: c[k] ? e[k] / c[k] * 100 : null }));
}
// No calls, no rate: null, never a 0% baseline.
const rate = (e, c) => c ? e / c * 100 : null;
// Change from rate a to rate b: "–" when either half has no calls, "New" when a is 0 and b isn't, "–" when both are 0. min: change shown without an arrow.
function change(a, b, min = 0) {
  if (a == null || b == null) return { text: "–", cls: "muted", title: `Not enough data in the ${a == null ? "first" : "second"} half` };
  if (!a) return b ? { text: "New", cls: "delta-up" } : { text: "–", cls: "muted" };
  const d = (b - a) / a * 100;
  return { text: `${d > min ? "▲ +" : d < -min ? "▼ " : ""}${fmt(d, 0)}%`, cls: d > min ? "delta-up" : d < -min ? "delta-down" : "muted" };
}

// ---------- KPIs ----------
function renderKpis(f) {
  const totalCalls = sumCalls(f.calls);
  const mid = iso(new Date((+toDate(f.start) + +toDate(lastDay)) / 2));
  const half = (arr, pick, first) => arr.filter(x => first ? pick(x) < mid : pick(x) >= mid);
  const r1 = rate(half(f.errs, x => x.d, true).length, sumCalls(half(f.calls, x => x[0], true)));
  const r2 = rate(half(f.errs, x => x.d, false).length, sumCalls(half(f.calls, x => x[0], false)));
  const delta = change(r1, r2);
  const counts = countBy(f.errs);
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  const nFix = Object.keys(fixes).length, idle = !totalCalls;
  $("#kpis").innerHTML = `
    <div class="card kpi"><div class="label">Errors</div><div class="value">${fmt(f.errs.length)}</div>
      <div class="note">of ${fmt(totalCalls)} tool calls</div></div>
    <div class="card kpi"><div class="label">Error rate</div><div class="value${idle ? " muted" : ""}">${idle ? "–" : fmt(rate(f.errs.length, totalCalls), 1) + "%"}</div>
      <div class="note">${idle ? "No tool calls in this period" : "errors per 100 tool calls"}</div></div>
    <div class="card kpi"><div class="label">Trend</div>
      <div class="value ${idle ? "muted" : delta.cls}">${idle ? "–" : delta.text}</div>
      <div class="note">${idle ? "No tool calls in this period" : r1 == null ? "No calls in the first half" : r2 == null ? "No calls in the second half"
        : `rate, 2nd half vs 1st half (${fmt(r1, 1)}% → ${fmt(r2, 1)}%)`}</div></div>

  const html = `<option value="">All projects</option>` + projects.map(([p, n]) => `<option value="${esc(p)}">${esc(p)} — ${fmt(n)} error${n === 1 ? "" : "s"} (all time)</option>`).join("");

  if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; }

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const narrow = matchMedia("(max-width: 900px)"), sheet = $("#sheet");
let sheetCat = null;

function placeDetail() {
  const d = $("#detail"), toSheet = narrow.matches && !!state.cat, home = toSheet ? sheet : $(".grid2");
  // The status region moves with the detail: outside the modal sheet it would be inert.
  if (d.parentNode !== home) { const had = d.contains(document.activeElement); home.append(d, $("#detailLive")); if (had) $("#detailTitle")?.focus({ preventScroll: true }); }
  if (!toSheet) { if (sheet.open) sheet.close(); return; }
  if (!sheet.open) sheet.showModal();
  if (sheetCat !== state.cat) { sheet.scrollTop = 0; $("#detailTitle").focus({ preventScroll: true }); }
  sheetCat = state.cat;
}
function focusDetail() {
  const h = $("#detailTitle"); if (!h) return;
  if (sheet.open) return h.focus({ preventScroll: true });
  const r = h.getBoundingClientRect();
  if (r.top < parseFloat(getComputedStyle(h).scrollMarginTop) || r.bottom > innerHeight) h.scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "auto" : "smooth" });
  h.focus({ preventScroll: true });
}
// A selector that finds the same control again after a re-render.
const focusKey = el => el.id ? "#" + CSS.escape(el.id) : ["c", "copy", "link", "full"].map(k => el.dataset?.[k] != null && `${el.tagName}[data-${k}="${CSS.escape(el.dataset[k])}"]`).find(Boolean);
let shownCat = null;
// push: add a history entry. toDetail: move focus to the opened type.
function render(push, toDetail) {
  const prev = document.activeElement, key = prev && prev !== document.body && focusKey(prev), wasCat = shownCat;
  store.set("claude-errors-view", { project: state.project, range: state.range, gran: state.gran, sub: state.sub, noise: state.noise, cat: state.cat });
  renderProjects();
  document.querySelectorAll("#fRange button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === state.range));
  document.querySelectorAll("#fGran button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.gran));

  const f = filtered();
  $("#gen").textContent = (state.range ? `${label(f.start, true)} to ${label(lastDay, true)}` : `All time to ${label(lastDay, true)}`)
    + (DATA.generated ? ` · Ingested ${new Date(DATA.generated).toLocaleString()}` : "");
  renderKpis(f); renderTable(f); renderChart(f); renderDetail(f); placeDetail();
  shownCat = state.cat;
  writeHash(push);
  if (toDetail && state.cat) return focusDetail();

  if (!prev || prev === document.body || prev.isConnected) return;

function selectExample(id) {

  document.querySelectorAll("#detail .ex").forEach(x => x.classList.toggle("focus", x.id === "ex-" + id));
  writeHash(true);
}
function scrollToFocus() {

}
(function init() {
  const linked = readHash();
  $("#fProject").onchange = e => { state.project = e.target.value; render(true); };
  document.querySelectorAll("#fRange button").forEach(b => b.onclick = () => { state.range = +b.dataset.v; render(true); });
  document.querySelectorAll("#fGran button").forEach(b => b.onclick = () => { state.gran = b.dataset.v; render(true); });
  $("#fSub").onchange = e => { state.sub = e.target.checked; render(true); };
  $("#fNoise").onchange = e => { state.noise = e.target.checked; render(true); };
  narrow.addEventListener("change", placeDetail);
  // Esc, the backdrop and ✕ close the sheet; closing it closes the type, and focus returns to that type's button.

  sheet.addEventListener("close", () => {
    const c = sheetCat; sheetCat = null;
    if (!narrow.matches) return $("#detailTitle")?.focus({ preventScroll: true });
    if (state.cat) { state.cat = null; state.focus = null; render(true); }
    if (c) $(`#catBody button[data-c="${CSS.escape(c)}"]`)?.focus();

  window.addEventListener("popstate", onNav); window.addEventListener("hashchange", onNav);

    const t = ev.target.closest("button[data-full]");
    if (t) {

      const ex = t.closest(".ex"), open = ex.classList.toggle("open");
      if (open) opened.add(t.dataset.full); else opened.delete(t.dataset.full);

    if (b) {
      const e = BY_ID[b.dataset.copy];
      navigator.clipboard?.writeText(exUrl(e)).then(() => { b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy URL", 1500); });
      return;
    }
    // Its Link, or a click anywhere on an example, selects it and puts its permalink in the address bar.
    const a = ev.target.closest("a"), row = ev.target.closest(".ex[id^='ex-']");
    if (a?.dataset.link && !(ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)) { ev.preventDefault(); return selectExample(a.dataset.link); }
    if (row && !a && !String(window.getSelection())) selectExample(row.id.slice(3));

  if (linked) scrollToFocus();
  // After a failed load, Retry was removed with the message: focus the page heading and say so.
  if (retried) { $("h1").focus(); $("#pageLive").textContent = "Errors loaded"; }
})();
