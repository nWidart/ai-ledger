<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Tool Errors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
body { line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 64px; }
/* Header as on Usage: page name left, filters right on the same row. */
.top { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.kicker { font-size: 15px; font-weight: 600; margin: 0; color: var(--text-secondary); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; max-width: 100%; }
/* The briefing: the period's answer as one sentence, as on Usage. */
.lede { margin: 0 0 8px; max-width: 34ch; font-size: clamp(24px, 4vw, 40px); line-height: 1.14;
  font-weight: 400; letter-spacing: -.025em; text-wrap: balance; color: var(--text-secondary); }
.lede b { font-weight: 600; letter-spacing: -.04em; color: var(--text-primary); }
.lede .dn { color: var(--good-text); font-weight: 500; } .lede .up { color: var(--critical-text); font-weight: 500; }
.lede:focus { outline: none; }
.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }
/* Vitals: Usage's ruled stat strip, same anatomy (value, label, note). */
.vitals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.vital { padding: 18px 20px 18px 0; min-width: 0; }
.vital + .vital { padding-left: 20px; border-left: 1px solid var(--border); }
.vital .v { font-size: 30px; font-weight: 600; letter-spacing: -.035em; line-height: 1.1; overflow-wrap: anywhere; }
.vital .v.txt { font-size: 19px; line-height: 1.25; letter-spacing: -.015em; padding-top: 6px; }
.vital .l { font-weight: 500; margin-top: 4px; }
.vital .d { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
@media (max-width: 900px) {
  .vitals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .vital:nth-child(3) { padding-left: 0; border-left: 0; }
  .vital:nth-child(n+3) { border-top: 1px solid var(--border); }
}
@media (max-width: 520px) {
  .vital { padding: 10px 12px 10px 0; } .vital + .vital { padding-left: 12px; } .vital:nth-child(3) { padding-left: 0; }
  .vital .v { font-size: 22px; } .vital .v.txt { font-size: 16px; }
  /* Phone: the finding, the rate and its change, then the chart; the rest of the summary waits behind More. */
  .lede { font-size: 21px; margin-bottom: 10px; }
  .vitals { margin-bottom: 8px; }
  .vitals:not(.open) .vital:nth-child(n+3), .sub.folded:not(.open) { display: none; }
  .moresum { display: block; margin: 0 0 14px; font-size: 13px; }
  .top { margin-bottom: 14px; gap: 8px; }
  .filters { gap: 6px; }
  .filters .seg button { padding: 5px 9px; font-size: 13px; }
  .filters select { padding-top: 5px; padding-bottom: 5px; font-size: 13px; }
  .filters .long { display: none; }
  .filters label.chk { font-size: 12.5px; }
  .chart-card .hint { display: none; }
}
.delta-down { color: var(--good-text); } .delta-up { color: var(--critical-text); }
.chart-card h2, .card h2 { font-size: 15px; margin: 0 0 2px; }
.chart-card .hint { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
#chart { position: relative; border-radius: 6px; }
#chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
#chart svg { display: block; width: 100%; height: 280px; overflow: visible; }
/* Legend: each type is a button that selects it; Other and the rate line are keys. */
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 10px; }
.legend button, .legend .key { font-size: 12px; padding: 2px 8px; display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; max-width: 100%; min-width: 0; }
.legend .key { color: var(--text-secondary); border: 1px solid transparent; }
.legend button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend button em { font-style: normal; color: var(--text-muted); }
.legend button[aria-pressed=true] { border-color: var(--text-secondary); font-weight: 500; background: var(--surface-2); }
.legend.has-sel button[aria-pressed=false] i { opacity: .35; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.sw.line { width: 14px; height: 0; border-radius: 0; border-top: 2px solid var(--text-primary); }
.sw.nodata { background: var(--surface-2); border: 1px dashed var(--border); }
/* Selecting a type lifts its layer and dims the rest in place. */
@media (prefers-reduced-motion: no-preference) { #chart .layer, #chart .fix { transition: opacity .2s; } }
#chart svg.has-sel .layer:not(.on), #chart svg.has-sel .fix:not(.on) { opacity: .2; }
.sw.line.sel { border-top-width: 2.5px; }
/* The selected type, named under the legend while it stays selected. */
.selout { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 13px; margin: -4px 0 10px; padding: 6px 10px;
  background: var(--surface-2); border-radius: 8px; }
.selout[hidden] { display: none; }
.selout b { display: inline-flex; gap: 6px; align-items: center; min-width: 0; }
.selout .muted { font-size: 12px; }
.selout button { margin-left: auto; font-size: 12px; padding: 2px 8px; }
.tip .trow { display: flex; gap: 14px; justify-content: space-between; align-items: center; }
.tip .trow > span { display: inline-flex; gap: 6px; align-items: center; }
.tip .trow.on { font-weight: 600; }
.tip .tot { border-bottom: 1px solid var(--border); margin-bottom: 4px; padding-bottom: 4px; }
/* Motion only for readers who haven't asked for less. */
@media (prefers-reduced-motion: no-preference) {
  #chart svg.grow .bars { animation: grow .55s cubic-bezier(.2, .7, .2, 1) both; transform-box: view-box; }
  #chart svg.grow .rline { stroke-dasharray: 1; animation: draw .7s .15s ease-out both; }
  .bar > i { animation: barIn .45s ease-out both; transform-origin: left; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes barIn { from { transform: scaleX(0); } }
}
.grid2 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.grid2 > * { min-width: 0; }
.tscroll { overflow-x: auto; }
.tbtn .sw { margin-right: 7px; vertical-align: 0; }
td .chip.fixed { margin-left: 6px; }
/* Where to start */
.pick .phead { display: flex; gap: 12px; justify-content: space-between; align-items: baseline; }
.pick .phead b { min-width: 0; }
.pick .phead .muted { flex: none; white-space: nowrap; font-size: 13px; }
.pick .act { color: var(--link); font-size: 13px; margin-top: 4px; }
.pick:hover .act { text-decoration: underline; }
.subh { font-size: 13px; font-weight: 600; margin: 18px 0 2px; }
.rise { color: var(--critical-text); font-weight: 600; font-variant-numeric: tabular-nums; }
/* Type detail: by project, and the rate when the main chart is out of view */
.byproj { margin: 12px 0; }
.byproj .stack { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
.byproj .stack i { display: block; height: 100%; min-width: 2px; }
.byproj ul { list-style: none; margin: 0; padding: 0; }
.byproj li button { display: grid; grid-template-columns: minmax(0, 1fr) auto 3rem; gap: 10px; width: 100%; background: none; border: 0; border-radius: 6px;
  padding: 4px 6px; margin: 0 -6px; text-align: left; font-size: 13px; }
.byproj li button:hover { background: var(--surface-2); }
.byproj li .v { font-variant-numeric: tabular-nums; text-align: right; }
.byproj li .s { color: var(--text-muted); text-align: right; font-size: 12px; }
.mini { margin: 4px 0 12px; }
.mini svg { display: block; width: 100%; height: 64px; overflow: visible; }
.mini[hidden] { display: none; }
@media (max-width: 520px) { .c-share, .c-trend { display: none; } }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.sel { background: var(--critical-soft); }
.tbtn { background: none; border: 0; border-radius: 4px; padding: 0; text-align: left; color: inherit; }
.tbtn:hover { background: none; }
.tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; min-width: 60px; }
/* A share under 3% (under 2px at the bar's 60px minimum) still gets a mark: a tick taller than the bar, so it reads as "present", not as a length */
.bar > .tick { position: absolute; left: 0; top: -2px; bottom: -2px; width: 2px; border-radius: 1px; }
.bar > i { display: block; height: 100%; background: var(--text-muted); border-radius: 3px; }
.share { display: flex; gap: 8px; align-items: center; }
.share .bar { flex: 1; }
.share span { font-size: 12px; color: var(--text-muted); min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
.chip { padding: 2px 7px; }
.chip.fixed { border-color: var(--good); color: var(--good-text); }
.spark { width: 84px; height: 22px; display: block; }
.detail h2 { font-size: 18px; margin-bottom: 4px; }
.detail .why { color: var(--text-secondary); margin: 0 0 12px; }
.fixbox { background: var(--surface-2); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.fixbox .t { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 4px; }
pre.snip { margin: 8px 0 0; padding: 10px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.ba div { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.ba .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ba .l { font-size: 12px; color: var(--text-muted); }
.ba .v.muted { font-size: 15px; font-weight: 500; padding: 3px 0; }
.ex { border-top: 1px solid var(--border); padding: 10px 0; }
.ex .meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.ex code, .ex .err { display: block; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word;
  overflow-wrap: anywhere; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.ex .err { color: var(--critical-text); }
/* Long bodies start clamped; "Show full" opens one example. */
.ex:not(.open) code, .ex:not(.open) .err, .ex:not(.open) blockquote { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.ex:not(.open) .err { -webkit-line-clamp: 4; }
.ex .full { display: block; font-size: 11px; padding: 1px 7px; border-radius: 6px; margin-top: 6px; }
.ex .full[hidden] { display: none; }
.ex .full[aria-busy=true] { cursor: progress; color: var(--text-muted); }
.ex .full.failed { border-color: var(--critical); color: var(--critical-text); }
.ex .cutnote { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.ex:not(.open) .cutnote { display: none; }
#exList .ex { cursor: pointer; }
.ex.focus { background: var(--series-1-soft); box-shadow: inset 3px 0 0 var(--series-1); padding-left: 10px; padding-right: 8px; border-radius: 6px; }
.ex .meta .link { margin-left: auto; display: inline-flex; gap: 6px; }
.ex .meta a { color: var(--link); text-decoration: none; }
.ex .meta a:hover { text-decoration: underline; }
.ex .meta button { font-size: 11px; padding: 1px 7px; border-radius: 6px; }
.ex blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 3px solid var(--series-1); color: var(--text-secondary); font-size: 13px; }
.pick { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 10px 4px; }
.pick > span { display: block; }
.pick:focus-visible, .ex:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Incidents: a type's failures grouped into episodes (one tool, one session, one error), each opening into its calls. */
.istat { font-size: 13px; color: var(--text-secondary); margin: -4px 0 12px; }
.istat b { color: var(--text-primary); }
.inc { border-top: 1px solid var(--border); }
.inc-h { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 6px; padding: 9px 6px; margin: 0; }
.inc-h:hover { background: var(--surface-2); }
.inc-h:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.inc-h .att { font-size: 18px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; grid-row: span 2; }
.inc-h .att small { font-size: 11px; font-weight: 500; color: var(--text-muted); display: block; letter-spacing: 0; }
.inc-h .who { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; font-size: 13px; }
.inc-h .when { grid-column: 2 / 4; font-size: 12px; color: var(--text-muted); }
.out { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
.out.ok { color: var(--good-text); border-color: var(--good); }
.out.bad { color: var(--critical-text); border-color: var(--critical); }
.out.warn { color: var(--warning-text); border-color: var(--warning-text); }
.inc-h .chev { display: inline-block; color: var(--text-muted); margin-left: 4px; }
.inc-h[aria-expanded=true] .chev { transform: rotate(90deg); }
.inc-b { padding: 0 0 10px 12px; margin-left: 6px; border-left: 2px solid var(--border); }
.inc-b[hidden] { display: none; }
.inc-b .ex:first-child { border-top: 0; }
.inc-b .step { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.recov { margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: var(--good-soft); font-size: 13px; }
.recov.none { background: var(--surface-2); color: var(--text-secondary); }
.recov code { display: block; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; background: var(--surface-1); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.exmode { margin: 8px 0 0; }
.exmode button { font-size: 12px; padding: 3px 10px; }
.fixout { font-size: 13px; margin: 0 0 12px; }
.fixout b { font-weight: 600; }
@media (min-width: 521px) { .moresum { display: none; } }
.outnote { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
#load { margin-bottom: 16px; }
#detailTitle, .ex, .inc { scroll-margin-top: calc(var(--appnav-h, 56px) + 12px); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font-size: 13px; }
.linkbtn:hover { background: none; text-decoration: underline; }
/* Wide screens: the type header and the example search stay in view while the examples scroll. */
@media (min-width: 901px) {
  #detail .dhead, #detail .exbar { position: sticky; z-index: 1; background: var(--surface-1); margin: 0 -16px; padding: 10px 16px; }
  #detail .dhead { top: var(--appnav-h, 56px); flex-wrap: nowrap; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  #detail .dhead h2 { margin: 0; min-width: 0; }
  #detail .exbar { top: calc(var(--appnav-h, 56px) + var(--dhead-h, 0px)); border-bottom: 1px solid var(--border); padding-bottom: 0; }
  #detail .ex, #detail .inc { scroll-margin-top: calc(var(--appnav-h, 56px) + var(--dhead-h, 0px) + var(--exbar-h, 0px) + 12px); }
}
.sheet #back { display: none; }
#detailTitle:focus { outline: none; }
/* Narrow screens: an open type shows in a sheet over the page; #detail moves into it and back. */
dialog.sheet { background: var(--surface-1); }
.sheet > .detail { border: 0; border-radius: 0; min-height: 100%; padding-top: 0; overflow-wrap: anywhere; }
.sheet .dhead { position: sticky; top: 0; z-index: 1; flex-wrap: nowrap; margin: 0 -16px 12px; padding: 12px 16px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet .dhead h2 { margin: 0; min-width: 0; }
.sheet .exbar { position: sticky; top: var(--dhead-h, 0px); z-index: 1; margin: 0 -16px; padding: 0 16px;
  background: var(--surface-1); border-bottom: 1px solid var(--border); }
.sheet .ex, .sheet .inc { scroll-margin-top: calc(var(--dhead-h, 0px) + var(--exbar-h, 0px) + 12px); }
/* Phone: only the type header sticks, so the list keeps most of the screen. */
@media (max-width: 520px) {
  .sheet .exbar { position: static; }
  .sheet .ex, .sheet .inc { scroll-margin-top: calc(var(--dhead-h, 0px) + 12px); }
}
</style>
</head>
<body>
<!--NAV-->
<div class="wrap">
  <header class="top">
    <p class="kicker">Claude tool errors</p>
    <div class="filters" role="group" aria-label="Filters">
      <span class="pick-project" id="fProjectWrap"><i class="pdot" aria-hidden="true"></i><select id="fProject" aria-label="Project"></select></span>
      <div class="seg" id="fRange" role="group" aria-label="Time range">
        <button data-v="7">7d</button><button data-v="14">14d</button><button data-v="30">30d</button><button data-v="90">90d</button><button data-v="0">All</button>
      </div>
      <div class="seg" id="fGran" role="group" aria-label="Granularity">
        <button data-v="day">Day</button><button data-v="week">Week</button>
      </div>
      <label class="chk"><input type="checkbox" id="fSub" checked> <span><span class="long">Include </span>subagents</span></label>
      <label class="chk" title="Harness errors and user rejections"><input type="checkbox" id="fNoise"> <span>Hide noise<span class="long"> (harness, user rejections)</span></span></label>
    </div>
  </header>

  <div class="card" id="load" role="status">Loading errors…</div>
  <div class="sr" id="pageLive" aria-live="polite"></div>
  <h1 class="lede" id="lede" tabindex="-1"></h1>
  <p class="sub folded" id="gen"></p>
  <section class="vitals" id="kpis" aria-label="Summary"></section>
  <button type="button" class="linkbtn moresum" id="moreSum" aria-expanded="false" aria-controls="kpis gen">More summary</button>

  <section class="card chart-card" aria-labelledby="chartTitle">
    <h2 id="chartTitle">Errors by type</h2>
    <div class="hint" id="chartHint"></div>
    <div class="legend" id="legend" role="group" aria-label="Error types in the chart"></div>
    <div class="selout" id="selOut" hidden></div>
    <div id="chart" tabindex="0" role="img" aria-label="Errors by type and error rate. Use the left and right arrow keys to read each point."></div>
    <div class="sr" id="chartLive" aria-live="polite"></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>Error types</h2>
      <div class="hint muted" style="font-size:12px;margin-bottom:8px">Trend compares the second half of the range with the first half. Click a row for fixes and examples.</div>
      <div class="tscroll"><table>
        <thead><tr><th>Type</th><th class="num">Errors</th><th class="c-share">Share</th><th class="c-trend">Rate trend</th><th class="num">Change</th></tr></thead>
        <tbody id="catBody"></tbody>
      </table></div>
    </section>
    <section class="card detail" id="detail"></section>
    <div class="sr" id="detailLive" aria-live="polite"></div>
  </div>
</div>
<dialog class="sheet" id="sheet" aria-labelledby="detailTitle"></dialog>
<div class="tip" id="tip" role="tooltip"></div>

<script type="module">
let retried = false;
async function load() {
  for (;;) {
    try { const r = await fetch("/api/errors"); if (!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }
    catch (err) {
      const el = document.getElementById("load");
      el.setAttribute("role", "alert");
      el.innerHTML = `<b>Couldn't load errors.</b> <span class="muted"></span> <button type="button">Retry</button>`;
      el.querySelector("span").textContent = `${err.message}. Check that the app is running.`;
      el.querySelector("button").focus();
      await new Promise(res => el.querySelector("button").onclick = res);
      retried = true;
      el.setAttribute("role", "status"); el.textContent = "Loading errors…";
    }
  }
}
const DATA = await load();
document.getElementById("load").remove();
// Project colors match Usage: the shared nav hands them out in the server's all-time order.
window.appnav?.setOrder(DATA.project_order);
const dot = p => window.appnav?.dot(p) ?? "";
const CATS = Object.fromEntries(DATA.categories.map(c => [c.id, c]));
const NOISE = new Set(["infra", "user_denied"]);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let fixes = store.get("claude-errors-fixes", {});
const state = Object.assign({ project: "", range: 30, gran: "day", sub: true, noise: false, cat: null, q: "" },
  store.get("claude-errors-view", {}));

    <div class="stack" aria-hidden="true">${top.map(([p, v]) => `<i style="flex:${v};background:${col(p)}" title="${esc(p)}"></i>`).join("")}${rest ? `<i style="flex:${rest};background:var(--proj-other)"></i>` : ""}</div>

    ${rest ? `<li class="muted" style="font-size:12px;padding:4px 0">${fmt(rows.length - 5)} more: ${fmt(rest)} errors</li>` : ""}</ul></div>`;
}
// The type's rate over the range with its fix marker, for when the main chart is out of view (scrolled away, or under the sheet).
function miniRate(f) {
  const pts = series(f.errs, f.calls, buckets(f.start), state.cat), fix = fixes[state.cat];
  const vt = viewTypes(f), i = fix ? pts.findIndex(p => p.k === bucketOf(fix)) : -1, max = Math.max(...pts.map(p => p.r || 0));
  return `<div class="row" style="justify-content:space-between;font-size:12px"><span class="muted">Error rate, ${state.range ? `last ${state.range} days` : "all time"}${fix && i >= 0 ? " · dashed line: fix applied" : ""}</span>
    <span class="muted">peak ${fmt(max, 2)}%</span></div>${spark(pts, { W: 600, H: 64, stroke: typeColor(state.cat, vt), marks: i >= 0 ? [i] : [] })}`;
}
// The mini chart shows only while the main chart is out of view.
let chartInView = true;
const syncMini = () => { const m = $("#mini"); if (m) m.hidden = chartInView && !sheet.open; };
new IntersectionObserver(es => { chartInView = es[es.length - 1].isIntersecting; syncMini(); }, { threshold: .25 }).observe(document.getElementById("chart"));
function exHtml(list) {
  return list.map(e => {
    // Loaded full text replaces the payload's; a field cut when it was recorded says so.
    const x = fullText.get(e.id) || e, note = k => x.cut?.includes(k) ? `<div class="cutnote">(summary as recorded)</div>` : "";
    return `<div class="ex${e.id && e.id === state.focus ? " focus" : ""}${opened.has(exKey(e)) ? " open" : ""}" tabindex="-1"${e.id ? ` id="ex-${esc(e.id)}"` : ""}${e.id && !fullText.has(e.id) && e.i.length >= PAYLOAD_INPUT ? " data-cut" : ""}>
    <div class="meta"><span>${esc(new Date(e.ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }))}</span>
      <span class="pname">${dot(e.p)}<span>${esc(e.p)}</span></span><span>${esc(e.t)}</span>${e.sub ? "<span>subagent</span>" : ""}${e.s ? `<a href="${sessionUrl(e)}" title="Open session ${esc(e.s)} in Usage">#${esc(e.s.slice(0, 8))}</a>` : ""}
      ${e.id ? `<span class="link"><a href="${esc(viewHash(e.id))}" data-link="${esc(e.id)}" title="Permalink to this error">🔗 Link</a><button type="button" data-copy="${esc(e.id)}">Copy URL</button></span>` : ""}</div>
    ${x.i ? `<code>${esc(x.i)}</code>${note("i")}` : ""}<div class="err">${esc(x.e)}</div>${note("e")}
    ${x.r ? `<blockquote>${esc(x.r)}</blockquote>${note("r")}` : ""}
    <button type="button" class="full" data-full="${esc(exKey(e))}" aria-expanded="${opened.has(exKey(e))}" hidden>${opened.has(exKey(e)) ? "Show less" : "Show full"}</button></div>`;
  }).join("") || `<div class="empty">No examples match.</div>`;
}

// One incident: attempts, where, when, how it ended; open, its failures in order and the call that recovered.
const openInc = new Set();
function incHtml(g) {
  const open = openInc.has(g.i), [ol, oc] = OUTCOME[g.outcome] || ["", ""], n = g.errs.length;
  const t0 = new Date(g.first), t1 = new Date(g.last), sameDay = t0.toDateString() === t1.toDateString();
  const when = t0.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    + (n > 1 ? ` – ${t1.toLocaleString(undefined, sameDay ? { hour: "2-digit", minute: "2-digit" } : { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })} · ${dur(incSpan(g))}` : "");
  return `<div class="inc" id="inc-${g.i}"><button type="button" class="inc-h" data-inc="${g.i}" aria-expanded="${open}" aria-controls="incb-${g.i}">
    <span class="att">${fmt(n)}×<small>${n === 1 ? "attempt" : "attempts"}</small></span>
    <span class="who"><span class="pname">${dot(g.p)}<span>${esc(g.p)}</span></span><span>${esc(g.t)}</span>${g.sub ? `<span class="muted">subagent</span>` : ""}</span>
    <span class="out ${oc}"${g.outcome === "recovered" ? ` title="The next ${esc(g.t)} call in this session succeeded"` : ""}>${ol}</span>
    <span class="when">${esc(when)}${g.ok ? ` · ${fmt(g.ok)} successful ${esc(g.t)} call${g.ok === 1 ? "" : "s"} in between` : ""}<span class="chev" aria-hidden="true">›</span></span></button>
    <div class="inc-b" id="incb-${g.i}"${open ? "" : " hidden"}>${open ? incBody(g) : ""}</div></div>`;
}
function incBody(g) {
  const after = g.rts ? dur(Math.max(0, Date.parse(g.rts) - Date.parse(g.last))) : "";
  const end = g.outcome === "recovered"
    ? `<div class="recov"><b>Next ${esc(g.t)} call succeeded</b> · ${after} later${g.ri ? ":" : "."}${g.ri ? `<code>${esc(g.ri)}</code>` : ""}</div>`
    : g.outcome === "gave_up" ? `<div class="recov none"><b>Gave up</b> · the session never called ${esc(g.t)} again${g.sub ? " from a subagent" : ""}.</div>`
    : `<div class="recov none"><b>Failed again</b> · the next ${esc(g.t)} call failed too, with another error or more than ${GAP} minutes later.</div>`;
  return exHtml(g.errs) + end;
}
function toggleInc(i, btn) {
  const open = !openInc.has(i), b = document.getElementById("incb-" + i);
  if (open) openInc.add(i); else openInc.delete(i);
  btn.setAttribute("aria-expanded", open);
  if (!b) return;
  const g = open && incidentsOf(filtered().errs.filter(e => e.n === i))[0];
  b.innerHTML = g ? incBody(g) : ""; b.hidden = !g;
  if (g) requestAnimationFrame(fitToggles);
}

// Examples opened with "Show full", by id (or time and tool for an example without one).
const opened = new Set(), exKey = e => e.id || e.ts + e.t;
// The payload cuts inputs at PAYLOAD_INPUT characters; "Show full" loads the rest once per id from /api/error.
const PAYLOAD_INPUT = 400, fullText = new Map(), loading = new Set();
async function loadFull(btn, id) {
  if (loading.has(id)) return;
  loading.add(id);
  btn.setAttribute("aria-busy", "true"); btn.classList.remove("failed"); btn.textContent = "Loading…";
  say("Loading full example…");
  try {
    const r = await fetch("/api/error?id=" + encodeURIComponent(id));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    fullText.set(id, await r.json());
  } catch {
    loading.delete(id);
    const b = document.querySelector(`#detail button[data-full="${CSS.escape(id)}"]`);
    if (b) { b.removeAttribute("aria-busy"); b.classList.add("failed"); b.textContent = "Couldn't load full text · Retry"; }
    return say("Couldn't load the full example. Use Retry to try again.");
  }
  loading.delete(id);
  // The example may have re-rendered meanwhile: redraw whichever copy is on the page now, open.
  opened.add(id);
  const ex = document.getElementById("ex-" + id);
  if (!ex) return;
  const had = ex.contains(document.activeElement), t = document.createElement("div");
  t.innerHTML = exHtml([BY_ID[id]]); ex.replaceWith(t.firstElementChild);
  fitToggles();
  if (had) document.querySelector(`#detail button[data-full="${CSS.escape(id)}"]`)?.focus();
  say("Full example shown");
}
// Concise status for screen readers: counts, loading, failures. The detail itself isn't live.
const say = s => { const l = $("#detailLive"); l.textContent = ""; requestAnimationFrame(() => l.textContent = s); };
// "Show full" only where a clamped body is cut off, the payload cut the input, or the example is already open.
function fitToggles() {
  document.querySelectorAll("#detail .full").forEach(b => {
    const ex = b.closest(".ex");
    b.hidden = !ex.classList.contains("open") && !("cut" in ex.dataset) && ![...ex.querySelectorAll("code, .err, blockquote")].some(x => x.scrollHeight > x.clientHeight + 1);
  });
}
const stuck = new ResizeObserver(() => {
  const d = $("#detail"), h = d.querySelector(".dhead"), b = d.querySelector(".exbar");
  d.style.setProperty("--dhead-h", (h?.offsetHeight || 0) + "px"); d.style.setProperty("--exbar-h", (b?.offsetHeight || 0) + "px");
});

// Usage shows the session's own project; only an Errors project filter carries over.
const sessionUrl = e => "/usage#" + new URLSearchParams({ range: state.range, session: e.s, ...(state.project && { project: state.project }) });

// ---------- wiring ----------
// Every project with errors or tool calls, plus the selected one, so a project picked on another page stays selectable.
const ERR_COUNT = DATA.calls.reduce((m, c) => (m[c[1]] = m[c[1]] || 0, m), {});
for (const e of DATA.errors) ERR_COUNT[e.p] = (ERR_COUNT[e.p] || 0) + 1;
function renderProjects() {
  const projects = Object.entries(ERR_COUNT).sort((a, b) => b[1] - a[1]);
  if (state.project && !(state.project in ERR_COUNT)) projects.push([state.project, 0]);
  const html = `<option value="">All projects</option>` + projects.map(([p, n]) => `<option value="${esc(p)}">${esc(p)} — ${fmt(n)} error${n === 1 ? "" : "s"} (all time)</option>`).join("");
  const sel = $("#fProject");
  if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; }
  sel.value = state.project;
  $("#fProjectWrap").classList.toggle("all", !state.project);
  $("#fProjectWrap .pdot").style.background = window.appnav?.color(state.project) ?? "";
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const narrow = matchMedia("(max-width: 900px)"), sheet = $("#sheet");
let sheetCat = null;
// Narrow screens show an open type in the sheet: the one #detail moves there and back, so it renders the same either way.
function placeDetail() {
  const d = $("#detail"), toSheet = narrow.matches && !!state.cat, home = toSheet ? sheet : $(".grid2");
  // The status region moves with the detail: outside the modal sheet it would be inert.
  if (d.parentNode !== home) { const had = d.contains(document.activeElement); home.append(d, $("#detailLive")); if (had) $("#detailTitle")?.focus({ preventScroll: true }); }
  if (!toSheet) { if (sheet.open) sheet.close(); return; }
  if (!sheet.open) sheet.showModal();
  if (sheetCat !== state.cat) { sheet.scrollTop = 0; $("#detailTitle").focus({ preventScroll: true }); }
  sheetCat = state.cat;
}
function focusDetail() {
  const h = $("#detailTitle"); if (!h) return;
  if (sheet.open) return h.focus({ preventScroll: true });
  const r = h.getBoundingClientRect();
  if (r.top < parseFloat(getComputedStyle(h).scrollMarginTop) || r.bottom > innerHeight) h.scrollIntoView({ block: "start", behavior: reduceMotion.matches ? "auto" : "smooth" });
  h.focus({ preventScroll: true });
}
// A selector that finds the same control again after a re-render.
const focusKey = el => el.id ? "#" + CSS.escape(el.id) : ["c", "copy", "link", "full", "inc", "m"].map(k => el.dataset?.[k] != null && `${el.tagName}[data-${k}="${CSS.escape(el.dataset[k])}"]`).find(Boolean);
let shownCat = null;
// push: add a history entry. toDetail: move focus to the opened type.
function render(push, toDetail) {
  const prev = document.activeElement, key = prev && prev !== document.body && focusKey(prev), wasCat = shownCat;
  store.set("claude-errors-view", { project: state.project, range: state.range, gran: state.gran, sub: state.sub, noise: state.noise, cat: state.cat });
  renderProjects();
  document.querySelectorAll("#fRange button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.v === state.range));
  document.querySelectorAll("#fGran button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.gran));
  $("#fSub").checked = state.sub; $("#fNoise").checked = state.noise;
  const f = filtered();
  $("#gen").textContent = (state.range ? `${label(f.start, true)} to ${label(lastDay, true)}` : `All time to ${label(lastDay, true)}`)
    + (DATA.generated ? ` · Ingested ${new Date(DATA.generated).toLocaleString()}` : "");
  renderKpis(f); renderTable(f); renderChart(f); renderDetail(f); placeDetail(); syncMini();
  // A new type fades in over the old one's place.
  if (wasCat !== state.cat && !reduceMotion.matches) $("#detail").animate?.([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "none" }], { duration: 200, easing: "ease-out" });
  shownCat = state.cat;
  writeHash(push);
  if (toDetail && state.cat) return focusDetail();
  // Never leave focus on a removed element: find it again, else the open type or the type just closed.
  if (!prev || prev === document.body || prev.isConnected) return;
  const sel = s => s && document.querySelector(s);
  (sel(key) || (state.cat ? $("#detailTitle") : sel(`#catBody button[data-c="${wasCat}"]`) || $("#catBody button")))?.focus();
}
function selectExample(id) {
  state.focus = id;
  document.querySelectorAll("#detail .ex").forEach(x => x.classList.toggle("focus", x.id === "ex-" + id));
  writeHash(true);
}
// A deep link lands on its example: scrolled into view, and keyboard focus there so Tab continues from it.
function scrollToFocus() {
  const el = state.focus && document.getElementById("ex-" + state.focus);
  if (!el) return;
  el.scrollIntoView({ block: "center" });
  el.focus({ preventScroll: true });
}
(function init() {
  const linked = readHash();
  $("#fProject").onchange = e => { state.project = e.target.value; render(true); };
  document.querySelectorAll("#fRange button").forEach(b => b.onclick = () => { state.range = +b.dataset.v; render(true); });
  document.querySelectorAll("#fGran button").forEach(b => b.onclick = () => { state.gran = b.dataset.v; render(true); });
  $("#fSub").onchange = e => { state.sub = e.target.checked; render(true); };
  $("#fNoise").onchange = e => { state.noise = e.target.checked; render(true); };
  narrow.addEventListener("change", placeDetail);
  // Esc, the backdrop and ✕ close the sheet; closing it closes the type, and focus returns to that type's button.
  sheet.addEventListener("click", ev => { if (ev.target === sheet) sheet.close(); });
  sheet.addEventListener("close", () => {
    const c = sheetCat; sheetCat = null;
    if (!narrow.matches) return $("#detailTitle")?.focus({ preventScroll: true });
    if (state.cat) { state.cat = null; state.focus = null; render(true); }
    if (c) $(`#catBody button[data-c="${CSS.escape(c)}"]`)?.focus();
  });
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { renderChart(filtered()); fitToggles(); }, 120); });
  // Back, Forward, the nav and permalink clicks all change the hash; re-read it unless it is the one just written.
  const onNav = () => { if (location.hash === lastHash) return; const ex = readHash(); render(); if (ex) scrollToFocus(); };
  window.addEventListener("popstate", onNav); window.addEventListener("hashchange", onNav);
  $("#moreSum").onclick = ev => {
    const b = ev.currentTarget, o = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", o); b.textContent = o ? "Less summary" : "More summary";
    $("#kpis").classList.toggle("open", o); $("#gen").classList.toggle("open", o);
  };
  $("#detail").addEventListener("click", ev => {
    const ib = ev.target.closest("button[data-inc]");
    if (ib) return toggleInc(+ib.dataset.inc, ib);
    const t = ev.target.closest("button[data-full]");
    if (t) {
      if (!t.closest(".ex").classList.contains("open") && BY_ID[t.dataset.full] && !fullText.has(t.dataset.full)) return loadFull(t, t.dataset.full);
      const ex = t.closest(".ex"), open = ex.classList.toggle("open");
      if (open) opened.add(t.dataset.full); else opened.delete(t.dataset.full);
      t.setAttribute("aria-expanded", open); t.textContent = open ? "Show less" : "Show full";
      if (!open && ex.getBoundingClientRect().top < 0) ex.scrollIntoView({ block: "start" });
      return;
    }
    const b = ev.target.closest("button[data-copy]");
    if (b) {
      const e = BY_ID[b.dataset.copy];
      navigator.clipboard?.writeText(exUrl(e)).then(() => { b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy URL", 1500); });
      return;
    }
    // Its Link, or a click anywhere on an example, selects it and puts its permalink in the address bar.
    const a = ev.target.closest("a"), row = ev.target.closest(".ex[id^='ex-']");
    if (a?.dataset.link && !(ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)) { ev.preventDefault(); return selectExample(a.dataset.link); }
    if (row && !a && !String(window.getSelection())) selectExample(row.id.slice(3));
  });
  render();
  if (linked) scrollToFocus();
  // After a failed load, Retry was removed with the message: focus the page heading and say so.
  if (retried) { $("#lede").focus(); $("#pageLive").textContent = "Errors loaded"; }
})();
</script>
</body>
</html>
