name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: "Release tag; the job fails unless it is v<package version>"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Committed build matches the sources
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all src/ai_ledger/web)" ]; then
            git status --short --untracked-files=all src/ai_ledger/web
            echo "::error::src/ai_ledger/web is stale: run npm run build in web/ and commit src/ai_ledger/web/"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.x" # uv_build is pinned to this minor in pyproject.toml
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - name: Tag matches the package version
        if: inputs.tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the package version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
