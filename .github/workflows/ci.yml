name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      tag:
        description: "Release tag; the job fails unless it is v<package version>"
        type: string
        default: ""
      ref:
        description: "Commit to check and package; empty checks the commit that started the run"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the Python and web jobs run: they are skipped when a push or PR changes only Markdown files.
  # The specs, web build and package jobs always run: specs are Markdown, the package embeds README.md,
  # and the package ships the web build.
  # A call from release.yml (inputs.ref set) always runs every job.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Detect non-Markdown changes
        id: diff
        env:
          REF: ${{ inputs.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          # Diffing two trees needs no history, so a shallow fetch of the base commit is enough.
          # A missing base (a new branch, a force push) leaves code=true.
          if [ -z "$REF" ] && [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE" \
            && files=$(git diff --name-only "$BASE" HEAD) && [ -n "$files" ] \
            && ! grep -qv '\.md$' <<< "$files"; then
            code=false
            echo "Only Markdown files changed: skipping the Python and web jobs."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  python-lint:
    name: Python · lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3: setup-uv publishes no major tags
        with:
          version: "0.13.x" # uv_build is pinned to this minor in pyproject.toml
      - run: uv sync --locked
      - run: uv run ruff check --output-format github

  python-tests:
    name: Python · tests
    needs: [changes, web-build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v8 # the app tests serve the build
        with:
          name: web-build
          path: src/ai_ledger/web
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
      - run: uv sync --locked
      - run: uv run pytest

  web-typecheck:
    name: Web · typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  web-lint:
    name: Web · lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint -- --format github

  web-tests:
    name: Web · tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  # git ignores src/ai_ledger/web: this job builds it once for the Python tests and the package.
  web-build:
    name: Web · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node scripts/check-bundle.mjs
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: src/ai_ledger/web/
          if-no-files-found: error

  specs:
    name: Specs · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npx --yes @fission-ai/openspec@1.16.0 validate --specs --strict

  package:
    name: Package
    needs: [python-lint, python-tests, web-typecheck, web-lint, web-tests, web-build, specs]
    # Runs when the Python and web jobs were skipped, but not when one failed or was cancelled.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
      - name: Tag matches the package version
        if: inputs.tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the package version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: src/ai_ledger/web
      - run: uv build
      - name: Wheel ships the web build
        run: |
          files=$(unzip -Z1 dist/*.whl)
          if ! grep -qx 'ai_ledger/web/index.html' <<< "$files" || ! grep -q '^ai_ledger/web/assets/.*\.js$' <<< "$files"; then
            echo "::error::the wheel has no web build in ai_ledger/web/"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
