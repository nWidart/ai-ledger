<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Opt in to the operating system's text scale (Chrome and Edge 146+; ignored elsewhere). Needs font sizes in rem and no root font-size. -->
<meta name="text-scale" content="scale">
<title>AI Ledger</title>
<!-- The nav's mark, inline so the browser asks for no /favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23b4502a' d='M6.5 2H9V30H6.5A3 3 0 0 1 3.5 27V5A3 3 0 0 1 6.5 2ZM11.5 2H25.5A3 3 0 0 1 28.5 5V18.5H11.5ZM11.5 21H28.5V24.25H11.5ZM11.5 26.75H28.5V27A3 3 0 0 1 25.5 30H11.5Z'/%3E%3C/svg%3E">
<!-- Apply a saved light or dark theme before first paint (src/theme.ts owns it after load). -->
<script>try { var t = localStorage.getItem("ai-ledger-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
