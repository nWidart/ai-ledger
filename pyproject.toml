[project]
name = "ai-ledger"
version = "0.3.0"
description = "Local store and dashboards for AI coding-agent transcripts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Widart", email = "n.widart@gmail.com" }]
keywords = ["claude-code", "codex", "transcripts", "dashboard", "duckdb", "llm", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.14"
dependencies = [
    "duckdb==2.0.0",
]

[project.scripts]
ai-ledger = "ai_ledger.app:main"

[project.urls]
Homepage = "https://github.com/nWidart/ai-ledger"
Issues = "https://github.com/nWidart/ai-ledger/issues"
Changelog = "https://github.com/nWidart/ai-ledger/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.17.4"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"] # named lambdas are the house style for small helpers
